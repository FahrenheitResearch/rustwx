[package]
name = "rustwx-products"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
wrf = ["dep:rustwx-wrf", "rustwx-io/wrf"]

[dependencies]
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
memmap2 = "0.9"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
shapefile = "0.7"
rustwx-calc = { path = "../rustwx-calc" }
rustwx-core = { path = "../rustwx-core" }
rustwx-cross-section = { path = "../rustwx-cross-section" }
rustwx-io = { path = "../rustwx-io" }
rustwx-models = { path = "../rustwx-models" }
rustwx-radar = { path = "../rustwx-radar" }
rustwx-render = { path = "../rustwx-render" }
rustwx-wrf = { path = "../rustwx-wrf", optional = true }
grib-core = { path = "../../vendor/grib-core" }
hdf5-reader = "0.3"
netcrust = { path = "../../vendor/netcrust" }
rustls.workspace = true
rustls-rustcrypto.workspace = true
ureq.workspace = true
