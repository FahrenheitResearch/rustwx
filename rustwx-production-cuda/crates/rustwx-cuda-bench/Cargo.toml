[package]
name = "rustwx-cuda-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "End-to-end pipeline benchmark — HRRR-shaped data through every ported product."

[dependencies]
rustwx-cuda        = { path = "../rustwx-cuda" }
rustwx-cuda-core   = { path = "../rustwx-cuda-core" }
rustwx-cuda-thermo = { path = "../rustwx-cuda-thermo" }
rustwx-cuda-wind   = { path = "../rustwx-cuda-wind" }
rustwx-cuda-grid   = { path = "../rustwx-cuda-grid" }
rustwx-cuda-severe = { path = "../rustwx-cuda-severe" }

# CPU baseline references
wx-math = { workspace = true }
metrust = { workspace = true }

rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "three_hours"
path = "src/main.rs"
